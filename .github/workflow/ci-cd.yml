name: Java Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mysql:15-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: msqyl
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Virtual Threads Support)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit & Integration Tests
        env:
          DB_URL: jdbc:mysql://localhost:5432/appdb
          DB_USER: user
          DB_PASSWORD: password
        run: ./gradlew test --info

      - name: Publish Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

      - name: Build Application Jar
        run: ./gradlew assemble

  docker-build:
    name: Build & Push Container Image
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-service:${{ github.sha }}

  deploy:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-service:latest
            docker stop backend-app || true
            docker rm backend-app || true
            docker run -d \
              --name backend-app \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DB_URL="${{ secrets.STAGING_DB_URL }}" \
              -e DB_USER="${{ secrets.STAGING_DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/backend-service:latest
            sudo systemctl reload nginx